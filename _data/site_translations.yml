- en: Data integration, preprocessing and quality assurance are fundamental steps in building reliable predictive
    models. This talk addresses the use of Artificial Intelligence in the integration pipeline, predictive tasks
    using integrated data, and emerging trends and opportunities in this field.
  pt: Integração, preprocessamento e qualificação dos dados são etapas fundamentais para construir modelos preditivos
    confiáveis. A palestra aborda o uso de Inteligência Artificial no pipeline de integração, as tarefas preditivas
    realizadas com dados integrados e as tendências e oportunidades nessa área.
- en: In a context where Artificial Intelligence (AI) drives innovation and decision-making in almost every field,
    the quality of the data feeding these systems is a fundamental pillar of their success. This discussion examines
    the close relationship between robust data and effective AI performance, addressing how incomplete, biased,
    inconsistent or outdated data can compromise models and lead to harmful decisions.
  pt: Em um cenário onde a Inteligência Artificial (IA) impulsiona a inovação e a tomada de decisões em praticamente
    todas as áreas, a qualidade dos dados que alimentam esses sistemas se estabelece como o pilar fundamental de
    seu sucesso. Esta discussão visa contextualizar o elo inseparável entre dados robustos e o desempenho eficaz
    da IA, abordando como dados incompletos, viesados, inconsistentes ou desatualizados não apenas comprometem a
    performance dos modelos, mas também podem levar a decisões críticas prejudiciais.
- en: 'The next generation of computational solutions for linking and integrating large volumes of data has advanced
    in two complementary directions: developing strategies to improve linkage quality and coverage across population
    groups, and using Artificial Intelligence models for tasks such as indexing, representation and pair classification.
    This talk introduces the foundations and provides an overview of research in Brazil, highlighting initiatives
    led by CIDACS/Fiocruz in collaboration with the Federal University of Bahia. Drawing on these experiences, it
    discusses recent advances, methodological challenges, and opportunities for research and collaboration, exploring
    how responsible AI can make fundamental data engineering processes more accurate, scalable and equitable.'
  pt: 'A nova geração de soluções computacionais para vinculação e integração de grandes volumes de dados tem avançado
    em duas direções complementares: o desenvolvimento de estratégias capazes de ampliar a qualidade e a cobertura
    da vinculação entre diferentes grupos populacionais e o uso de modelos de Inteligência Artificial para etapas
    como indexação, representação e classificação de pares. Neste contexto, esta palestra apresenta os fundamentos
    e um panorama das pesquisas desenvolvidas no Brasil nesse campo, com destaque para iniciativas conduzidas no
    CIDACS/Fiocruz em colaboração com a Universidade Federal da Bahia. A partir dessas experiências, serão discutidos
    avanços recentes, desafios metodológicos e oportunidades de investigação e colaboração, explorando como o uso
    responsável da Inteligência Artificial pode contribuir para tornar processos fundamentais da engenharia de dados
    mais precisos, escaláveis e equitativos.'
- en: Data integration; data preprocessing and quality assurance strategies; AI in the data integration pipeline;
    predictive tasks using integrated data; trends and opportunities.
  pt: Integração de dados; estratégias de preprocessamento e qualificação dos dados; uso de IA no pipeline da integração
    de dados; tarefas preditivas usando dados integrados; tendências e oportunidades.
- en: The period refers to the substitute teaching appointment recorded in Lattes; the CV does not specify the semester
    offerings of each course.
  pt: O período corresponde ao vínculo de professor substituto informado no Lattes; o currículo não detalha as ofertas
    semestrais de cada disciplina.
- en: The Lattes description associates this 2022 course with the Department of Computer Science at UFBA’s Institute
    of Computing, although the record appears under the institutional affiliation with CIDACS. The teaching institution
    was identified from the explicit description.
  pt: A descrição do Lattes associa esta disciplina de 2022 ao Departamento de Ciência da Computação do Instituto
    de Computação da UFBA, embora o registro esteja inserido sob o vínculo institucional do CIDACS. A instituição
    de ensino foi identificada pelo conteúdo explícito da descrição.
- en: This record describes the preparation of an instructional plan (PDP), including content, activities, teaching
    strategy and assessment, to guide on-site tutors and distance-learning teachers. It has not been interpreted
    as evidence of an in-person class.
  pt: O registro descreve a elaboração do Planejamento Didático-Pedagógico (PDP), incluindo conteúdo, atividades,
    estratégia pedagógica e avaliação, para orientar tutores presenciais e professores a distância. Não foi interpretado
    como comprovação de uma turma ministrada presencialmente.
- en: Lattes provides the activity title and year but does not identify the organizing institution, day, month or
    teaching hours in this record.
  pt: O Lattes informa o título e o ano da atividade, mas não identifica a instituição promotora, o dia, o mês ou
    a carga horária neste registro.
- en: 'Introduction to computer networks: terminology; types of networks; network software and hardware; network
    architectures and models; network layers; network services; security and ethical aspects of networking.'
  pt: 'Introdução a redes de computadores: terminologia; tipos de redes; software e hardware de rede; arquiteturas
    e modelos de redes; camadas de rede; serviços de redes; segurança e aspectos éticos em redes.'
- en: Modelling problems for computational solutions. Informal introduction to algorithms. Introduction to programming
    logic. Structured programming.
  pt: Modelagem para solução em computadores. Conceito informal de algoritmos. Introdução à lógica de programação.
    Programação estruturada.
- en: Number systems; character representation; Boolean functions; combinational and sequential circuits; the von
    Neumann machine; introduction to advanced architectures.
  pt: Sistemas de numeração; representação de caracteres; funções booleanas; circuitos combinacionais e sequenciais;
    máquina de Von Neumann; introdução a arquiteturas avançadas.
