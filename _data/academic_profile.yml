intro_en: I am an Adjunct Professor at the Federal University of Bahia (UFBA) and an associate researcher at CIDACS/Fiocruz.
  My work connects data integration, record linkage and machine learning, with an emphasis on large-scale population
  and health data.
intro_pt: Sou professor adjunto da Universidade Federal da Bahia (UFBA) e pesquisador associado ao CIDACS/Fiocruz.
  Minha atuação reúne integração de dados, vinculação de registros e aprendizado de máquina, com ênfase em dados
  populacionais e de saúde em larga escala.
