# Official syllabus and programme from the supplied teaching plan; lesson sequence from SIGAA.
code: MATA60
title_pt: Bancos de Dados
title_en: Database Systems
institution: Universidade Federal da Bahia (UFBA)
syllabus_pt: Arquitetura geral de um SGBD. Modelo de Entidades e Relacionamentos (ER) e suas extensões. O modelo
  relacional. Mapeamento de um projeto ER em um projeto relacional. Linguagem de definição e manipulação de dados.
  Álgebra e cálculo relacional. Mapeamento de consultas em álgebra e cálculo relacional em SQL. Normalização. Mecanismo
  de otimização de consultas. Introdução aos modelos de rede, hierárquico e orientado a objetos. Projeto físico
  de banco de dados. Gerenciamento de transações e controle de concorrência. Mecanismos de recuperação de falhas.
  Introdução a banco de dados não-relacionais.
syllabus_en: General DBMS architecture. The entity–relationship (ER) model and its extensions. The relational model.
  Mapping an ER design into a relational design. Data definition and manipulation languages. Relational algebra
  and calculus. Mapping relational algebra and calculus queries into SQL. Normalisation. Query optimisation mechanisms.
  Introduction to network, hierarchical and object-oriented models. Physical database design. Transaction management
  and concurrency control. Failure recovery mechanisms. Introduction to non-relational databases.
syllabus_kind: official
official_syllabus_url: /files/teaching/mata60/plano-de-ensino-mata60.pdf
modules:
- id: fundamentos
  number: I
  title_pt: Fundamentos e ambiente de banco de dados
  title_en: Database foundations and environment
  summary_pt: Conceitos, SGBDs, arquiteturas, linguagens e modelos.
  summary_en: Concepts, DBMSs, architectures, languages and models.
  lessons:
  - number: 1
    title_pt: Introdução aos sistemas de banco de dados
    title_en: Introduction to database systems
    summary_pt: Dados, bancos de dados e SGBDs; arquiteturas e linguagens.
    summary_en: Data, databases and DBMSs; architectures and languages.
    materials:
    - fundamentos
  - number: 2
    title_pt: Primeiro contato com um SGBD
    title_en: First steps with a DBMS
    summary_pt: Exploração de um ambiente de banco de dados e de suas operações básicas.
    summary_en: Exploring a database environment and its basic operations.
    materials:
    - fundamentos
    - empresa
  - number: 3
    title_pt: Modelos de dados
    title_en: Data models
    summary_pt: Modelos de representação e níveis de abstração para organizar dados.
    summary_en: Representation models and abstraction levels for organising data.
    materials:
    - fundamentos
- id: modelagem
  number: II
  title_pt: Modelagem e definição de esquemas
  title_en: Modelling and schema definition
  summary_pt: Modelos ER e relacional, mapeamento, dependências e SQL-DDL.
  summary_en: ER and relational models, mapping, dependencies and SQL-DDL.
  lessons:
  - number: 4
    title_pt: Modelo Entidade-Relacionamento I
    title_en: Entity–relationship model I
    summary_pt: Entidades, atributos, identificadores e relacionamentos.
    summary_en: Entities, attributes, identifiers and relationships.
    materials:
    - mer
    - compraesperta
  - number: 5
    title_pt: Modelo Entidade-Relacionamento II
    title_en: Entity–relationship model II
    summary_pt: Papéis, cardinalidade, participação e regras do domínio.
    summary_en: Roles, cardinality, participation and domain rules.
    materials:
    - mer
    - compraesperta
    - empresa
  - number: 6
    title_pt: Modelo relacional
    title_en: The relational model
    summary_pt: Relações, tuplas, atributos, esquemas e chaves.
    summary_en: Relations, tuples, attributes, schemas and keys.
    materials:
    - relacional
  - number: 7
    title_pt: Mapeamento ER → relacional
    title_en: ER-to-relational mapping
    summary_pt: Tradução da modelagem conceitual para esquemas e restrições relacionais.
    summary_en: Translating conceptual models into relational schemas and constraints.
    materials:
    - restricoes
    - relacional
    - empresa
  - number: 8
    title_pt: Problemas de projeto e dependências funcionais
    title_en: Design problems and functional dependencies
    summary_pt: Consistência do projeto, dependências funcionais e refinamento de esquemas.
    summary_en: Design consistency, functional dependencies and schema refinement.
    materials:
    - restricoes
    - eventos
  - number: 9
    title_pt: 'SQL: definição de dados I'
    title_en: 'SQL: data definition I'
    summary_pt: Criação de tabelas, tipos, chaves e restrições de integridade.
    summary_en: Creating tables, data types, keys and integrity constraints.
    materials:
    - ddl
    - sql-portavel
  - number: 10
    title_pt: 'SQL: definição de dados II e prática'
    title_en: 'SQL: data definition II and practice'
    summary_pt: Alteração de esquemas e implantação do banco de dados EMPRESA.
    summary_en: Schema changes and implementation of the EMPRESA database.
    materials:
    - ddl
    - empresa
    - fisico
- id: consultas
  number: III
  title_pt: Normalização e linguagens de consulta
  title_en: Normalisation and query languages
  summary_pt: Normalização, álgebra relacional e SQL para consultas.
  summary_en: Normalisation, relational algebra and SQL queries.
  lessons:
  - number: 11
    title_pt: Normalização I
    title_en: Normalisation I
    summary_pt: Dependências e fundamentos da organização de esquemas normalizados.
    summary_en: Dependencies and the foundations of normalised schema design.
    materials:
    - eventos
  - number: 12
    title_pt: Normalização II
    title_en: Normalisation II
    summary_pt: Formas normais, decomposição e refinamento do projeto relacional.
    summary_en: Normal forms, decomposition and refinement of relational designs.
    materials:
    - sciencereview
    - fomentapesquisa
  - number: 13
    title_pt: Laboratório de normalização
    title_en: Normalisation lab
    summary_pt: Aplicação dos conceitos de normalização aos estudos de caso.
    summary_en: Applying normalisation concepts to the case studies.
    materials:
    - eventos
    - sciencereview
    - fomentapesquisa
  - number: 14
    title_pt: Álgebra relacional
    title_en: Relational algebra
    summary_pt: Operadores e composição de consultas sobre relações.
    summary_en: Operators and query composition over relations.
    materials:
    - relacional
  - number: 15
    title_pt: Da álgebra relacional ao SQL
    title_en: From relational algebra to SQL
    summary_pt: Expressão de consultas relacionais por meio da linguagem SQL.
    summary_en: Expressing relational queries using SQL.
    materials:
    - relacional
    - consultas
  - number: 16
    title_pt: 'SQL: consultas básicas'
    title_en: 'SQL: basic queries'
    summary_pt: Seleção de atributos, condições de filtragem e ordenação de resultados.
    summary_en: Selecting attributes, filtering conditions and ordering results.
    materials:
    - consultas
    - empresa
  - number: 17
    title_pt: 'SQL: relacionando tabelas'
    title_en: 'SQL: combining tables'
    summary_pt: Consultas que combinam informações de diferentes relações.
    summary_en: Queries combining information from different relations.
    materials:
    - empresa
    - eventos
    - consultas-avancadas
  - number: 18
    title_pt: 'SQL: agregação'
    title_en: 'SQL: aggregation'
    summary_pt: Funções de agregação, agrupamento e consultas por grupos.
    summary_en: Aggregate functions, grouping and grouped queries.
    materials:
    - empresa
    - sciencereview
    - consultas-avancadas
  - number: 19
    title_pt: Laboratório SQL
    title_en: SQL lab
    summary_pt: Construção de consultas para os esquemas e casos trabalhados na disciplina.
    summary_en: Building queries for the schemas and cases used in the course.
    materials:
    - empresa
    - sql-portavel
    - eventos
    - consultas-avancadas
- id: operacao
  number: IV
  title_pt: Transações, organização física e desempenho
  title_en: Transactions, physical organisation and performance
  summary_pt: Concorrência, índices, transações e aperfeiçoamento de consultas.
  summary_en: Concurrency, indexes, transactions and query improvement.
  lessons:
  - number: 20
    title_pt: Transações e concorrência
    title_en: Transactions and concurrency
    summary_pt: Conceito de transação, propriedades ACID e controle de concorrência.
    summary_en: The transaction concept, ACID properties and concurrency control.
    materials:
    - empresa
    - restricoes
    - transacoes
  - number: 21
    title_pt: Laboratório de transações
    title_en: Transactions lab
    summary_pt: Experimentos com BEGIN, COMMIT e ROLLBACK, isolamento e acesso concorrente.
    summary_en: Experiments with BEGIN, COMMIT and ROLLBACK, isolation and concurrent access.
    materials:
    - empresa
    - lab-transacoes
    - transacoes
  - number: 22
    title_pt: Índices e organização física
    title_en: Indexes and physical organisation
    summary_pt: Hierarquia de armazenamento, organização física, índices ordenados, árvores B+, hash e bitmap.
    summary_en: Storage hierarchy, physical organisation, ordered indexes, B+ trees, hash and bitmap.
    materials:
    - fisico
    - indexacao
    - indexacao-btree
  - number: 23
    title_pt: Laboratório de desempenho e integração
    title_en: Performance and integration lab
    summary_pt: Análise e aperfeiçoamento das consultas e da implementação dos estudos de caso.
    summary_en: Analysing and improving case-study queries and implementations.
    materials:
    - eventos
    - sciencereview
    - fomentapesquisa
    - indexacao
    - indexacao-btree
- id: emergentes
  number: V
  title_pt: Sistemas emergentes
  title_en: Emerging systems
  summary_pt: Big Data e sistemas baseados em vetores.
  summary_en: Big Data and vector-based systems.
  lessons:
  - number: 24
    title_pt: 'Sistemas emergentes: Big Data e bases vetoriais'
    title_en: 'Emerging systems: Big Data and vector databases'
    summary_pt: Introdução a modelos e sistemas para novos cenários de representação e integração de dados.
    summary_en: Introduction to models and systems for new data representation and integration scenarios.
    materials:
    - fundamentos
