program_modules:
- number: I
  title_pt: Introdução aos Sistemas de Banco de Dados
  title_en: Introduction to Database Systems
  topics:
  - pt: Aplicações e conceitos fundamentais de bancos de dados
    en: Database applications and fundamental concepts
  - pt: 'Sistemas Gerenciadores de Bancos de Dados: arquiteturas, usuários e linguagens'
    en: 'Database management systems: architectures, users and languages'
  - pt: Introdução aos modelos de dados
    en: Introduction to data models
- number: II
  title_pt: Modelagem e Projeto de Bancos de Dados
  title_en: Database Modelling and Design
  topics:
  - pt: Modelos de dados e níveis de abstração
    en: Data models and abstraction levels
  - pt: Modelo Entidade-Relacionamento (MER)
    en: Entity–relationship model (ER)
  - pt: Restrições de integridade e modelagem
    en: Integrity constraints and modelling
  - pt: Modelo Relacional (MR)
    en: Relational model
  - pt: Mapeamento do Modelo Entidade-Relacionamento para o Modelo Relacional
    en: Mapping the entity–relationship model to the relational model
  - pt: Redundância e anomalias em esquemas relacionais
    en: Redundancy and anomalies in relational schemas
  - pt: Dependências funcionais
    en: Functional dependencies
  - pt: 'Normalização de dados: 1FN, 2FN, 3FN e BCNF'
    en: 'Data normalisation: 1NF, 2NF, 3NF and BCNF'
- number: III
  title_pt: Linguagens de Bancos de Dados
  title_en: Database Languages
  topics:
  - pt: Introdução à Álgebra Relacional
    en: Introduction to relational algebra
  - pt: Introdução ao Cálculo Relacional
    en: Introduction to relational calculus
  - pt: 'SQL: linguagem de definição de dados (DDL)'
    en: 'SQL: data definition language (DDL)'
  - pt: 'SQL: linguagem de manipulação e consulta de dados (DML)'
    en: 'SQL: data manipulation and query language (DML)'
  - pt: Consultas envolvendo junções, agregações, subconsultas e visões
    en: Queries using joins, aggregates, subqueries and views
- number: IV
  title_pt: Processamento de Consultas e Administração de Bancos de Dados
  title_en: Query Processing and Database Administration
  topics:
  - pt: Organização física dos dados e indexação
    en: Physical data organisation and indexing
  - pt: Processamento e otimização de consultas
    en: Query processing and optimisation
  - pt: Transações
    en: Transactions
  - pt: Controle de concorrência e propriedades ACID
    en: Concurrency control and ACID properties
- number: V
  title_pt: Introdução a Tópicos Contemporâneos em Bancos de Dados
  title_en: Introduction to Contemporary Database Topics
  topics:
  - pt: Bancos de dados para grandes volumes de dados e sistemas distribuídos
    en: Databases for large data volumes and distributed systems
  - pt: Bancos de dados NoSQL e modelos não relacionais
    en: NoSQL databases and non-relational models
  - pt: Bancos de dados autoajustáveis e tendências em sistemas de gerenciamento de dados
    en: Self-tuning databases and trends in data management systems
